<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#111b24"/>
<title>GARAGE PARK | 愛車の駐車ゲーム</title>
<link rel="stylesheet" href="./style.css"/>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="game" aria-label="駐車場の3D映像。俯瞰モードではドラッグで車の周囲を回転、ピンチで拡大できます"></canvas>
<div class="hud">
  <header class="header">
    <div class="header-copy"><div class="eyebrow">GARAGE PARK <span> / PARKING CHALLENGE</span></div><h1 id="stage-name">狭い駐車場</h1><p id="stage-desc">車を駐車枠の中央に停止させよう</p></div>
    <div class="header-actions">
      <div class="view-tabs" role="group" aria-label="カメラ視点">
        <button class="view active" data-view="chase" aria-pressed="true">外観</button>
        <button class="view" data-view="overhead" aria-pressed="false">俯瞰</button>
        <button class="view" data-view="cockpit" aria-pressed="false">車内</button>
      </div>
      <button id="restart" class="icon-button" aria-label="コースをやり直す" title="やり直す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11a9 9 0 1 1 3 7M3 4v7h7"/></svg></button>
    </div>
  </header>
  <aside class="progress" aria-label="ステージ">
    <div class="progress-header"><span id="stage-number">01 / 03</span><span id="stage-difficulty">入門</span></div>
    <div class="progress-grid"><span>残り距離</span><strong id="remaining">--</strong><span>接触</span><strong id="hits">0</strong><span>経過</span><strong id="timer">00:00</strong></div>
    <button class="next-stage" id="skip">コース切替 <span aria-hidden="true">›</span></button>
  </aside>
  <div id="callout" class="callout" role="status">目的の枠に車を入れ、停止させよう</div>
  <div id="target-label" class="target-label">GOAL</div>
  <div id="mirrors" class="mirrors" aria-label="後方ミラー">
    <div id="mirror-left" class="mirror mirror-side"><span>LEFT</span></div>
    <div id="mirror-rear" class="mirror mirror-rear"><span>REAR</span></div>
    <div id="mirror-right" class="mirror mirror-side"><span>RIGHT</span></div>
  </div>
  <div id="cabin" class="cabin" aria-hidden="true"><div class="cabin-dashboard"><div class="wheel"></div><div class="cluster"><div>GARAGE</div><strong id="cabin-speed">0</strong><small>km/h</small></div><div class="cabin-console"></div></div></div>
  <footer class="footer">
    <div class="steering" role="group" aria-label="ハンドル操作">
      <button class="drive-key steer-key" id="left" aria-label="ハンドルを左に切る"><svg viewBox="0 0 24 24"><path d="M15 5 8 12l7 7M8 12h13"/></svg><span>左</span></button>
      <button class="drive-key steer-key" id="right" aria-label="ハンドルを右に切る"><svg viewBox="0 0 24 24"><path d="m9 5 7 7-7 7M16 12H3"/></svg><span>右</span></button>
    </div>
    <div class="speed-panel" aria-live="off"><div><strong id="speed">00</strong><span>km/h</span></div><div class="speed-meta"><span id="gear">N</span><span id="alignment">調整中</span></div></div>
    <div class="pedals" role="group" aria-label="アクセル操作">
      <button class="drive-key" id="reverse"><svg viewBox="0 0 24 24"><path d="M12 4v16m0 0-6-6m6 6 6-6"/></svg><span>バック</span></button>
      <button class="drive-key brake-key" id="brake"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>ブレーキ</span></button>
      <button class="drive-key go-key" id="forward"><svg viewBox="0 0 24 24"><path d="M12 20V4m0 0-6 6m6-6 6 6"/></svg><span>前進</span></button>
    </div>
  </footer>
  <div class="keyboard-hint">WASD / 矢印で操作・Spaceでブレーキ・1〜3で視点変更</div>
</div>
<div id="loading" class="modal visible"><div class="loading-body"><div class="loading-ring"></div><p class="modal-overline">GARAGE PARK</p><h2 id="loading-title">愛車を読み込み中</h2><p id="loading-message">元の3Dモデルと駐車場を準備しています</p><button id="retry" hidden>再読み込み</button></div></div>
<div id="result" class="modal"><div class="result-body"><p class="modal-overline">PARKING COMPLETED</p><h2>駐車成功</h2><div class="result-stars" id="stars">★★★</div><div id="summary">接触0回</div><div class="result-actions"><button id="retry-stage" class="plain">もう一度</button><button id="next-stage" class="primary">次のコース</button></div></div></div>
<script type="module" src="./game.mjs"></script>
</body></html>
