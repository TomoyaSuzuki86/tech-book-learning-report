  <footer class="bottom"><div class="ctrl" role="group" aria-label="ハンドル操作"><button class="control" id="left" aria-label="左にハンドルを切る"><svg viewBox="0 0 24 24"><path d="M19 12H5m0 0 6-6m-6 6 6 6"/></svg><span>左</span></button><button class="control" id="right" aria-label="右にハンドルを切る"><svg viewBox="0 0 24 24"><path d="M5 12h14m0 0-6-6m6 6-6 6"/></svg><span>右</span></button></div><div class="telemetry"><strong id="speed">0.0</strong><span>km/h</span><small id="gear">P ・ 停車</small></div><div class="ctrl" role="group" aria-label="アクセル操作"><button class="control brake" id="reverse" aria-label="後退する"><svg viewBox="0 0 24 24"><path d="M12 19V5m0 14 6-6m-6 6-6-6"/></svg><span>バック</span></button><button class="control go pedal" id="forward" aria-label="前進する"><svg viewBox="0 0 24 24"><path d="M12 5v14m0-14 6 6m-6-6-6 6"/></svg><span>進む</span></button></div></footer>

<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),canvas=$('stage'),gl=canvas.getContext('webgl',{alpha:false,antialias:true,depth:true,powerPreference:'high-performance'});

const flatFS=`precision mediump float;uniform vec4 color;void main(){gl_FragColor=color;}`;
function shader(kind,src){const x=gl.createShader(kind);gl.shaderSource(x,src);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(x));return x}

const a={pos:gl.getAttribLocation(program,'pos'),norm:gl.getAttribLocation(program,'norm'),uv:gl.getAttribLocation(program,'uv')},u={mvp:gl.getUniformLocation(program,'mvp'),model:gl.getUniformLocation(program,'mod'),eye:gl.getUniformLocation(program,'eye'),tint:gl.getUniformLocation(program,'tint'),tex:gl.getUniformLocation(program,'tex')},fa=gl.getAttribLocation(flatProgram,'pos'),fu={mvp:gl.getUniformLocation(flatProgram,'mvp'),color:gl.getUniformLocation(flatProgram,'color')};
function buf(data,target=gl.ARRAY_BUFFER){let b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,gl.STATIC_DRAW);return b}
function mul(a,b){let o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++)o[c*4+r]=a[r]*b[c*4]+a[4+r]*b[c*4+1]+a[8+r]*b[c*4+2]+a[12+r]*b[c*4+3];return o}
function trans(x,y,z,rot=0,s=1){let c=Math.cos(rot)*s,q=Math.sin(rot)*s;return new Float32Array([c,0,-q,0,0,s,0,0,q,0,c,0,x,y,z,1])}

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0),cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],normal=v=>{let l=Math.hypot(...v)||1;return v.map(x=>x/l)};
function lookAt(eye,to){let zz=normal(sub(eye,to)),xx=normal(cross([0,1,0],zz)),yy=cross(zz,xx);return new Float32Array([xx[0],yy[0],zz[0],0,xx[1],yy[1],zz[1],0,xx[2],yy[2],zz[2],0,-dot(xx,eye),-dot(yy,eye),-dot(zz,eye),1])}
function rect(verts,x,z,w,d,y=.002){let X=x-w/2,Z=z-d/2;verts.push(X,y,Z,X+w,y,Z,X+w,y,Z+d, X,y,Z,X+w,y,Z+d,X,y,Z+d)}
function boxline(verts,x,z,w,d,y=.027){let l=x-w/2,r=x+w/2,t=z-d/2,b=z+d/2;verts.push(l,y,t,r,y,t,r,y,t,r,y,b,r,y,b,l,y,b,l,y,b,l,y,t)}
function addLines(verts,a,b,y=.025){verts.push(a[0],y,a[1],b[0],y,b[1])}

let goal=[];const halfW=1.31,halfD=2.7;const points=[[ -halfW,-halfD],[halfW,-halfD],[halfW,halfD],[-halfW,halfD]].map(([x,z])=>[slot.x+x*Math.cos(slot.yaw)+z*Math.sin(slot.y),slot.z-x*Math.sin(slot.yaw)+z*Math.cos(slot.yaw)]);for(let i=0;i<4;i++)addLines(goal,points[i],points[(i+1)%4],.03);gather('goal',gl.LINES,goal);

async function loadModel(data){let p=parseGLB(data),newTexture=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,newTexture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([216,224,224,255]));if(p.textureBlob){let url=URL.createObjectURL(p.textureBlob);try{let img=new Image();img.src=url;await img.decode();gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);}finally{URL.revokeObjectURL(url)}}gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);if(model){for(let k of ['position','normals','uv','indices'])gl.deleteBuffer(model[k]);gl.deleteTexture(model.texture)}let indexData=p.indices.raw,indexType=p.indices.a.componentType===5125?gl.UNSIGNED_INT:gl.UNSIGNED_SHORT;if(indexType===gl.UNSIGNED_INT&&!gl.getExtension('OES_element_index_uint')){let src=new Uint32Array(indexData.buffer);if(Math.max(...src)>65535)throw Error('頂点形式が端末に非対応です');indexData=new Uint8Array(Uint16Array.from(src).buffer);indexType=gl.UNSIGNED_SHORT}model={position:buf(p.position.raw),normals:buf(p.normals.raw),uv:buf(p.uv.raw),indices:buf(indexData,gl.ELEMENT_ARRAY_BUFFER),indexType,count:p.indices.a.count,texture:newTexture,scale:4.4/p.length,center:p.center};}
function drawModel(vp,eye,x,z,yaw,scale=1,tint=[1,1,1]){if(!model)return;gl.useProgram(program);for(let [loc,key,size] of [[a.pos,'position',3],[a.norm,'normals',3],[a.uv,'uv',2]]){gl.bindBuffer(gl.ARRAY_BUFFER,model[key]);gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,size,gl.FLOAT,false,0,0)}gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,model.indices);let sc=model.scale*scale,m=trans(x,0,z,yaw,sc); // car center already at origin, bounding position is approx centered

function drawWorld(vp){gl.useProgram(flatProgram);gl.enableVertexAttribArray(fa);gl.uniformMatrix4fv(fu.mvp,false,vp);for(let b of sceneBuffers){gl.bindBuffer(gl.ARRAY_BUFFER,b.buffer);gl.vertexAttribPointer(fa,3,gl.FLOAT,false,0,0);gl.uniform4fv(fu.color,b.color);gl.drawArrays(b.mode,0,b.count)}}
function drawScene(vp,eye,showPlayer){drawWorld(vp);for(const o of obstacles)drawModel(vp,eye,o.x,o.z,o.yaw,1,o.tint);if(showPlayer)drawModel(vp,eye,car.x,car.z,car.yaw)}
const forward=yaw=>[Math.sin(yaw),Math.cos(yaw)];const here=(ox,oy,oz)=>[car.x+ox*Math.cos(car.yaw)+oz*Math.sin(car.yaw),oy,car.z-ox*Math.sin(car.yaw)+oz*Math.cos(car.yaw)];
function drawView(x,y,w,h,eye,target,fov,mirror,showPlayer){if(w<=0||h<=0)return;gl.viewport(x,y,w,h);gl.scissor(x,y,w,h);gl.clearColor(.11,.20,.25,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);let view=lookAt(eye,target),vp=mul(perspective(fov,w/h,.08,130,mirror),view);drawScene(vp,eye,showPlayer)}
function mirrorView(el,eye,dir,fov){let d=el.getBoundingClientRect(),rect=canvas.getBoundingClientRect();const sx=canvas.width/rect.width,sy=canvas.height/rect.height;let x=Math.round((d.left-rect.left)*sx),y=Math.round((rect.bottom-d.bottom)*sy),w=Math.round(d.width*sx),h=Math.round(d.height*sy);drawView(x,y,w,h,eye,[eye[0]+dir[0]*15,eye[1]+dir[1]*15,eye[2]+dir[2]*15],fov,true,false)}
function renderFrame(){if(!model)return;const dpr=Math.min(devicePixelRatio||1,1.5),w=Math.max(2,Math.round(canvas.clientWidth*dpr)),h=Math.max(2,Math.round(canvas.clientHeight*dpr));if(w!==canvas.width||h!==canvas.height){canvas.width=w;canvas.height=h}gl.enable(gl.DEPTH_TEST);gl.disable(gl.CULL_FACE);gl.enable(gl.SCISSOR_TEST);const fwd=forward(car.yaw),eye=viewMode==='chase'?here(0,8.6,-10.8):viewMode==='top'?here(0,17,-.01):here(.48,1.38,.46);let target=viewMode==='chase'?here(0,.55,2.4):viewMode==='top'?here(0,0,0):here(.48+fwd[0]*12,1.38,fwd[1]*12+.46);if(viewMode==='cockpit'){target=here(.48,1.38,12);}

function obbOverlap(a,b){const axes=[a.yaw,b.yaw].flatMap(y=>[[Math.cos(y),-Math.sin(y)],[Math.sin(y),Math.cos(y)]]);const r1=[[Math.cos(a.yaw),-Math.sin(a.yaw)],[Math.sin(a.yaw),Math.cos(a.yaw)]],r2=[[Math.cos(b.yaw),-Math.sin(b.yaw)],[Math.sin(b.y),Math.cos(b.yaw)]];for(let axis of axes){let da=Math.abs((b.x-a.x)*axis[0]+(b.z-a.z)*axis[1]);let proj=(box,ax)=>Math.abs(ax[0]*Math.cos(box.yaw)-ax[1]*Math.sin(box.y))*box.w/2+Math.abs(ax[0]*Math.sin(box.yaw)+ax[1]*Math.cos(box.yaw))*box.d/2;if(da>proj(a,axis)+proj(b,axis))return false}return true}
function carRect(x=car.x,z=car.z,yaw=car.yaw){return{x,z,yaw,w:1.84,d:4.28}}
function collision(x,z,yaw){if(Math.abs(x)>10.5||Math.abs(z)>13.0)return true;return obstacles.some(o=>obbOverlap(carRect(x,z,yaw),{...o,w:1.85,d:4.32}))}
function wrappedDiff(a,b){return Math.atan2(Math.sin(a-b),Math.cos(a-b))}
function update(dt){if(!started||finished||!model)return;elapsed+=dt;const throttle=Number(input.forward)-Number(input.reverse);const targetSteer=Number(input.right)-Number(input.left);steer+=(targetSteer-steer)*Math.min(1,dt*6);let accel=throttle!==0?throttle*(v*throttle<0?6:3.6):0;if(!throttle){let damp=3.5*dt;v=Math.abs(v)<=damp?0:v-Math.sign(v)*damp}else v+=accel*dt;v=Math.max(-3.15,Math.min(4.0,v));const old=[car.x,car.z,car.yaw],midYaw=car.yaw+(v*Math.tan(steer*.56)/2.65)*dt;car.x+=Math.sin(midYaw)*v*dt;car.z+=Math.cos(midYaw)*v*dt;car.yaw=midYaw;if(collision(car.x,car.z,car.yaw)){[car.x,car.z,car.yaw]=old;v=0;if(performance.now()-lastHit>1200){hits++;lastHit=performance.now();tip('<strong>接触！</strong>　切り返して駐車しよう。',2000)}}
 const diffX=car.x-slot.x,diffZ=car.z-slot.z,cos=Math.cos(slot.yaw),sin=Math.sin(slot.yaw),side=diffX*cos-diffZ*sin,fore=diffX*sin+diffZ*cos,heading=Math.abs(wrappedDiff(car.yaw,slot.yaw));const parked=Math.abs(side)<.37&&Math.abs(fore)<.46&&heading<.14&&Math.abs(v)<.19;if(parked){successCounter+=dt;if(successCounter>.8){finished=true;clearControls();v=0;const score=Math.max(40,100-Math.floor(elapsed*1.4)-hits*12);$('summary').textContent=`所要時間 ${elapsed.toFixed(1)}秒 ／ 接触 ${hits}回 ／ スコア ${score}点`;$('nextLevel').textContent=levelIndex===levels.length-1?'最初のステージへ':'次のステージへ';$('result').classList.add('show')}}else{successCounter=0}updateHUD()}
function updateHUD(){let d=Math.hypot(slot.x-car.x,slot.z-car.z);$('distance').textContent=d.toFixed(1)+'m';$('angle').textContent=Math.round(Math.abs(wrappedDiff(car.yaw,slot.yaw))/DEG)+'°';$('hits').textContent=String(hits);let s=Math.floor(elapsed);$('clock').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('speed').textContent=(Math.abs(v)*3.6).toFixed(1);$('gear').textContent=Math.abs(v)<.03?'P ・ 停車':v>0?'D ・ 前進':'R ・ 後退';$('wheel').style.transform=`rotate(${steer*75}deg)`}
function clearControls(){for(const k of Object.keys(input))input[k]=false;document.querySelectorAll('.control').forEach(el=>el.classList.remove('pressed'))}
for(let name of Object.keys(input)){let el=$(name);el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;e.preventDefault();el.setPointerCapture(e.pointerId);input[name]=true;el.classList.add('pressed')});function up(){input[name]=false;el.classList.remove('pressed')}for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,up)}const keys={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'forward',w:'forward',W:'forward',ArrowDown:'reverse',s:'reverse',S:'reverse'};window.addEventListener('keydown',e=>{let k=keys[e.key];if(k){e.preventDefault();input[k]=true;$(k).classList.add('pressed')}});window.addEventListener('keyup',e=>{let k=keys[e.key];if(k){e.preventDefault();input[k]=false;$(k).classList.remove('pressed')}});window.addEventListener('blur',clearControls);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearControls()});
function camera(mode){viewMode=mode;document.body.classList.toggle('cockpit',mode==='cockpit');document.querySelectorAll('[data-camera]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.camera===mode)));tip(mode==='cockpit'?'<strong>車内視点</strong>　ルーム・左右ミラーで周囲を確認。':mode==='top'?'<strong>俯瞰視点</strong>　駐車位置と角度を確認。':'<strong>外観視点</strong>　愛車を眺めながら運転。',2200)}document.querySelectorAll('[data-camera]').forEach(b=>b.addEventListener('click',()=>camera(b.dataset.camera)));$('restart').addEventListener('click',()=>level(levelIndex));$('stageNext').addEventListener('click',()=>level(levelIndex+1));$('again').addEventListener('click',()=>level(levelIndex));$('nextLevel').addEventListener('click',()=>level(levelIndex+1));$('uploadBtn').addEventListener('click',()=>$('model-upload').click());$('model-upload').addEventListener('change',async e=>{let file=e.target.files[0];if(!file)return;try{await loadModel(await file.arrayBuffer());tip('<strong>モデルを変更しました。</strong>　この端末内でのみ反映されます。',3300)}catch(err){tip('モデルを読み込めません：'+err.message,5000)}});
let pointers=new Map();canvas.addEventListener('pointerdown',e=>{if(viewMode!=='chase')return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{let p=pointers.get(e.pointerId);if(!p)return;p.x=e.clientX;p.y=e.clientY});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,e=>pointers.delete(e.pointerId)));
