<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#0b111c"/>
  <meta name="description" content="愛車の3Dモデルで運転を楽しむドライビング・プレビュー"/>
  <title>GARAGE PARK / DRIVE LAB</title>
</head>
<body>
  <canvas id="world" aria-label="愛車を操作する3Dドライブシーン" role="img"></canvas>
  <div class="hud">
    <header class="top">
      <div class="brand"><div class="brand-kicker">GARAGE PARK <span> / DRIVE LAB</span></div><h1>走る、愛車。</h1><div class="brand-desc" id="status">車体モデルを準備しています…</div></div>
      <nav class="toolbar" aria-label="視点切り替え">
        <div class="switch" role="group" aria-label="カメラ">
          <button class="camera active" data-view="follow" aria-pressed="true">追従</button>
          <button class="camera" data-view="top" aria-pressed="false">俯瞰</button>
          <button class="camera" data-view="orbit" aria-pressed="false">鑑賞</button>
        </div>
        <button class="utility" id="reset" aria-label="車を最初の位置に戻す" title="リセット">
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M3 11a9 9 0 1 1 3.4 7M3 5v6h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </nav>
    </header>

    <div class="message" id="message" role="status" aria-live="polite">
      <span class="message-dot"></span><span id="message-text">車体の読み込み中…</span>
    </div>

    <div class="foot">
      <div class="drive-label">STEP 01 <span>動きと見た目を確認する試作版</span></div>
      <div class="drive-controls">
        <div class="steer" role="group" aria-label="ステアリング">
          <button class="control" data-action="left" aria-label="左にハンドルを切る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 6-6 6 6 6M9 12h11"/></svg><span>左</span>
          </button>
          <button class="control" data-action="right" aria-label="右にハンドルを切る">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6M15 12H4"/></svg><span>右</span>
          </button>
        </div>
        <div class="speed" aria-live="off"><div class="speed-digits"><strong id="speed">00</strong><small>km/h</small></div><div class="speed-bottom"><span id="gear">N</span><span class="divider-v"></span><span id="distance">0.0m</span></div></div>
        <div class="pedals" role="group" aria-label="アクセルとブレーキ">
          <button class="control control-back" data-action="reverse"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 20-5-5m5 5 5-5m-5 5V4"/></svg><span>後退</span></button>
          <button class="control control-stop" data-action="brake"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>停止</span></button>
          <button class="control control-forward" data-action="forward"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 4-5 5m5-5 5 5m-5-5v16"/></svg><span>前進</span></button>
        </div>
      </div>
      <div class="hint">キー操作：W/A/S/D ・ 矢印キー ・ Space停止 ・ 1/2/3視点切替</div>
    </div>
  </div>
  <div class="overlay" id="loader" role="alertdialog" aria-labelledby="load-title" aria-describedby="load-detail"><div class="loader-card"><div class="loader-orbit" aria-hidden="true"></div><div class="loader-kicker">GARAGE PARK / DRIVE LAB</div><h2 id="load-title">愛車を準備中</h2><p id="load-detail">オリジナルの形状とテクスチャを読み込んでいます。</p><button id="reload" hidden>もう一度読み込む</button></div></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
